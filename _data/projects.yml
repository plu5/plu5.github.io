- name: retype
  desc: (Python3, Qt) GUI application for training typing while reading books.
  cringe_comments: I started it as a teenager and matured a lot during the process; it is scary to have users and, suddenly, responsibility. You are forced to develop better practices to avoid humiliating yourself and letting people down.
